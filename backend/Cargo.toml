[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = {version = "0.8.1", features = ["json"]}
reqwest = {version = "0.12.12", features = ["json", "rustls-tls"], default-features = false }
serde = {version = "1.0.217", features = ["derive"]}
serde_json = "1.0.137"
tokio = {version = "1.43.0", features = ["full"]}
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = 3   # Optimize for size and speed.
lto = true     # Link Time Optimization (LTO) to further optimize the binary.
codegen-units = 1      # Number of codegen units to use. Higher values can improve compile times but may increase binary size.