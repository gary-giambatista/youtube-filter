<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      width: 220px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }

    h1 {
      font-size: 1rem;
      margin-top: 5px;
    }

    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-switch h2 {
      font-size: .875rem;
      width: 50%;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #4CAF50;
    }

    input:checked + .slider:before {
      transform: translateX(14px);
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    /* Coming Soon */
    .coming-soon {
      background: #eee;
      border: 1px solid #ccc;
      padding: 10px;
      padding-top: 0;
      cursor: not-allowed;
      opacity: 0.35;
      margin-block: 8px;
    }
    .coming-soon h2 {
      font-size: .875rem;
    }
    .coming-soon input {
      padding: 5px;
      width: calc(100% - 20px);
      cursor: not-allowed;
    }
    /* Options Section */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
  <script type="module" src="./popup.js"></script>
</head>
<body>
  <h1>YouTube Video Filters:</h1>
  <hr></hr>
  <main>
    <!-- Negativity Filter -->
    <section id="negativity-filter">
      <div class="toggle-switch">
        <h2>Negative Videos:</h2> 
        <label class="switch">
          <input type="checkbox" id="toggle" checked="true">
          <span class="slider"></span>
        </label>
        <span id="toggle-status">Enabled</span>
      </div>
      <form class="options-container">
        <fieldset id="filter-blur-options">
          <legend>Filter Blur Level:</legend>
          
          <label>
            <input type="radio" name="strength" value="weak">
            Weak
          </label>
      
          <label>
            <input type="radio" name="strength" value="medium" checked>
            Medium
          </label>
      
          <label>
            <input type="radio" name="strength" value="strong">
            Strong
          </label>
      
          <label>
            <input type="radio" name="strength" value="hide">
            Hide Videos Completely
          </label>
        </fieldset>

        <fieldset id="video-hover-preview-options">
          <legend>Video Hover Preview</legend>

          <label>
            <input type="radio" name="preview" value="show" checked>
            Show
          </label>
      
          <label>
            <input type="radio" name="preview" value="hide">
            Hide
          </label>
        </fieldset>
      </form>        
    </section>
    <section id="custom-filters">
      <div class="coming-soon">
        <h2>Custom Filters coming soon</h2> 
        <input type="text" placeholder="Filter videos with..."/>
      </div>

    <hr></hr>
    <!-- Shorts Filter -->
    <section id="shorts-filter">
      <div class="toggle-switch">
        <h2>Hide All Shorts:</h2>
        <label class="switch">
          <input type="checkbox" id="toggle" checked="true">
          <span class="slider"></span>
        </label>
        <span id="toggle-status">Enabled</span>
      </div>
    </section>
  </main>
</body>
</html>
